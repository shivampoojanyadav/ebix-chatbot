<!DOCTYPE html>
<html>
<head>
    <title>Ebix FAQ Chatbot</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 30px;
        }

        h1{
            text-align: center;
            color: #1d4ed8;
        }

        .chat-container{
            width: 80%;
            margin: auto;
        }

        .input-area{
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input{
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button{
            padding: 15px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover{
            background: #1e40af;
        }

        #chat-box{
            background: white;
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #ccc;
        }

        .user-message{
            background: #dbeafe;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .bot-message{
            background: #dcfce7;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
        }

    </style>

</head>

<body>

    <div class="chat-container">

        <h1>Ebix FAQ Chatbot</h1>

        <div class="input-area">

            <input type="text" id="question" placeholder="Ask your question...">

            <button onclick="sendMessage()">Send</button>

        </div>

        <div id="chat-box"></div>

    </div>

    <script>

        async function sendMessage(){

            let questionInput = document.getElementById("question");

            let question = questionInput.value;

            if(question.trim() === ""){
                return;
            }

            let chatBox = document.getElementById("chat-box");

            chatBox.innerHTML += `
                <div class="user-message">
                    <b>You:</b> ${question}
                </div>
            `;

            let response = await fetch("/get-response/", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                },

                body: JSON.stringify({
                question: question
                })

            });

            let data = await response.json();

            chatBox.innerHTML += `
                <div class="bot-message">
                    <b>Bot:</b> ${data.answer}
                </div>
            `;

            questionInput.value = "";

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById("question")
        .addEventListener("keypress", function(event){

            if(event.key === "Enter"){
                sendMessage();
            }

        });

        function getCookie(name) {

        let cookieValue = null;

        if (document.cookie && document.cookie !== '') {

        const cookies = document.cookie.split(';');

        for (let i = 0; i < cookies.length; i++) {

            const cookie = cookies[i].trim();

            if (cookie.substring(0, name.length + 1) === (name + '=')) {

                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));

                break;
            }
        }
    }

    return cookieValue;
}

    </script>

</body>
</html>
